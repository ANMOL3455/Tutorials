<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Font oroperties </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Foldit:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
    <h3 align="center"> Font properties</h3>
    <hr>
    <h4>Font Style</h4>
    <P style="font-style: italic;">ITALIC</P>
    <p style="font-style: oblique;"">OBLIQUE</p>
    <p style="font-style: normal;">NORMAL</p>
    <hr>
    <h4>Font Family</h4>
<hr>
<h4>Font Family</h4>
<p style="font-family: Georgia, serif;">Serif</p>
<p style="font-family: Arial, sans-serif;">Sans-Serif</p>
<p style="font-family: Courier New, monospace;">Monospace</p>
<p style="font-family: Brush Script MT, cursive;">Cursive</p>
<p style="font-family: Papyrus, fantasy;">Fantasy</p>
<hr>
<h4>Google Fonts</h4>
<p style="font-family: Poppins,sans-serif;"> Poppins</p>
<p style="font-family:Foldit, sans-serif; font-weight:bold; font-size:30px;">SOPHIA</p>
<hr>
<h4>Font weight</h4>
<p style="font-weight: bold;">hi</p>
<p style="font-weight: normal;">hii</p>
<p style="font-weight: lighter;">hiii</p>
<p style="font-weight: bolder;">hiiii</p>
<p style="font-weight: 900px;">helooo</p>
<hr>
<h4>Font size</h4>
<p style="font-size:30px;""> kta hoooo! kata kata</p>
</body>
</html>
